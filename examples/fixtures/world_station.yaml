actors:
- actor_id: npc.caretaker
  name: Synthetic Caretaker
  kind: npc
  controller:
    kind: sub_agent
  initial_scene_id: scene.platform
  senses:
    visual: true
    auditory: true
  npc_state:
    schema_version: npc-state/1
    profile:
      role: lamp caretaker
      personality:
      - patient
      - cautious
      speaking_style: Short, precise sentences.
      constraints:
      - Keep private records private.
    initial_knowledge_ids:
    - fact.lamp
    memories:
    - record_id: memory.backstory
      version: 1
      is_current: true
      text: Caretaker private backstory.
      sources:
      - kind: package
        reference_id: npc.caretaker
        version: null
      epistemic_status: told
    beliefs:
    - record_id: belief.lamp
      version: 1
      is_current: false
      text: I suspect the lamp is wooden.
      sources:
      - kind: package
        reference_id: npc.caretaker
        version: null
      epistemic_status: inferred
      confidence_basis_points: 7000
      status: active
    - record_id: belief.lamp
      version: 2
      is_current: true
      text: I suspect the lamp is wooden.
      sources:
      - kind: memory
        reference_id: memory.backstory
        version: 1
      epistemic_status: inferred
      confidence_basis_points: null
      status: retracted
    relationships:
    - record_id: relationship.visitor
      version: 1
      is_current: true
      text: Respect the visiting player.
      sources:
      - kind: package
        reference_id: npc.caretaker
        version: null
      target_id: selected_pc
      stance: friendly
    goals:
    - record_id: goal.inspect
      version: 1
      is_current: true
      text: Keep the lamp inspected.
      sources:
      - kind: package
        reference_id: npc.caretaker
        version: null
      status: active
    plans:
    - record_id: plan.inspect
      version: 1
      is_current: true
      text: Inspect the lamp after work.
      sources:
      - kind: package
        reference_id: npc.caretaker
        version: null
      goal_id: goal.inspect
      goal_version: 1
      steps:
      - Finish current task.
      - Inspect lamp.
      status: active
    runtime:
      schedule:
      - schedule_id: schedule.inspection
        scene_id: scene.platform
        start_tick: 10
        end_tick: 20
        activity: Inspect lamp.
      current_activity: null
  initial_cell: 2,2
