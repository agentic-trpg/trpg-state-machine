[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "trpg-state-machine"
version = "0.1.0"
description = "Session and scene persistence foundation for Agentic TRPG"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/trpg_state_machine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
